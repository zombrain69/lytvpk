name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Go and frontend
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test Go code
        run: go test ./...

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Check canonical release naming
        shell: pwsh
        run: |
          $expectedExecutable = 'LytVPK-Community-Fork.exe'
          $wailsConfig = Get-Content -LiteralPath .\wails.json -Raw | ConvertFrom-Json
          if ($wailsConfig.outputfilename -ne [System.IO.Path]::GetFileNameWithoutExtension($expectedExecutable)) {
            throw "wails.json must use $expectedExecutable"
          }
          $versionSource = Get-Content -LiteralPath .\internal\app\version.go -Raw
          if ($versionSource -notmatch [regex]::Escape($expectedExecutable)) {
            throw "CommunityForkExecutableName must be $expectedExecutable"
          }
          $buildScript = Get-Content -LiteralPath .\scripts\build-release.ps1 -Raw
          if ($buildScript -notmatch [regex]::Escape($expectedExecutable)) {
            throw "build-release.ps1 must package $expectedExecutable"
          }

  package:
    name: Build canonical Windows package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and package CI artifact
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File .\scripts\build-release.ps1 -Version 0.0.0-ci -SkipIdentityVerification

      - name: Verify CI release archive contract
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File .\scripts\verify-release.ps1 `
            -Version 0.0.0-ci `
            -ArchivePath .\build\release\LytVPK-Community-Fork_v0.0.0-ci_windows_amd64.zip

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: LytVPK-Community-Fork-ci-windows-amd64
          path: build/release/LytVPK-Community-Fork_v0.0.0-ci_windows_amd64.zip
          if-no-files-found: error
          retention-days: 7
