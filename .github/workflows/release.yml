name: Release

# A release is created only by pushing a valid semantic-version tag, for example
# v2.5.14-community.3. The workflow intentionally uploads one Windows ZIP with
# the same canonical executable name that the in-app updater accepts.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    # Release publication is restricted to the maintained fork account.
    if: github.repository == 'zombrain69/lytvpk' && github.actor == 'zombrain69'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify fork release identity
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'zombrain69/lytvpk') {
            throw "Release workflow is restricted to zombrain69/lytvpk."
          }
          if ($env:GITHUB_ACTOR -cne 'zombrain69') {
            throw "Release workflow is restricted to the maintained fork owner."
          }
          if ($env:GITHUB_REF_TYPE -cne 'tag' -or $env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release workflow must run from a valid semantic-version tag."
          }

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag must be vMAJOR.MINOR.PATCH (optional prerelease suffix): $tag"
          }
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test Go code
        run: go test ./...

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package canonical Windows release
        shell: pwsh
        run: |
          # The preceding step validates the pushed annotated tag, actor, and
          # target commit. CI packages do not have a developer Git identity.
          pwsh -ExecutionPolicy Bypass -File .\scripts\build-release.ps1 -Version "${{ steps.version.outputs.version }}" -SkipIdentityVerification

      - name: Verify release archive contract
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $archive = ".\build\release\LytVPK-Community-Fork_v${version}_windows_amd64.zip"
          pwsh -ExecutionPolicy Bypass -File .\scripts\verify-release.ps1 -Version $version -ArchivePath $archive

      - name: Create checksum
        id: checksum
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $assetName = "LytVPK-Community-Fork_v${version}_windows_amd64.zip"
          $assetPath = ".\build\release\$assetName"
          $checksumPath = ".\build\release\SHA256SUMS.txt"
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          "asset=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish release and its single Windows package
        shell: pwsh
        run: |
          & gh release create $env:GITHUB_REF_NAME `
            "${{ steps.checksum.outputs.asset }}" `
            "${{ steps.checksum.outputs.checksum }}" `
            --repo $env:GITHUB_REPOSITORY `
            --title "LytVPK Community Fork ${{ steps.version.outputs.version }}" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE"
          }
